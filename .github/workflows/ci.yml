name: oracle-local-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  v11:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle_v11_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle_v11_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://oracle:oracle@localhost:5432/oracle_v11_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V10 and V11 dependencies
        run: python -m pip install -r requirements-v11-py312.lock.txt && python -m pip check
      - name: V11 offline integration and actual penaltyblog tests
        run: python -m pytest tests/test_v11.py tests/test_v11_mission2.py tests/test_v11_postgres.py -q --junitxml=variable/v11-tests.xml
      - name: V11 isolated ledger schema and backup smoke
        run: |
          python -m v11 --ledger variable/ci-v11.sqlite3 status
          python -m v11 --ledger variable/ci-v11.sqlite3 backup variable/ci-v11-restored.sqlite3
      - name: Publication history guard
        run: |
          git fetch --no-tags origin e565b2438269561f40970c5debe3a13be05facf7
          python scripts/v11_publication_audit.py --base e565b2438269561f40970c5debe3a13be05facf7
      - name: Upload V11 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-test-results
          path: variable/v11-tests.xml
  v11-container:
    runs-on: ubuntu-latest
    needs: v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.28.1
      - name: Build V11 image with locked dependencies
        run: docker build -f Dockerfile.v11 -t oracle-v11-ci .
      - name: Start private container with persistent volume and restricted filesystem
        run: >-
          docker run -d --name oracle-v11-ci-smoke -p 127.0.0.1:18000:8000
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --cap-drop ALL
          --security-opt no-new-privileges:true
          -e INTERNAL_API_TOKEN=ci-only-not-a-secret
          --mount type=volume,src=oracle-v11-ci-data,dst=/app/variable oracle-v11-ci
      - name: Verify authentication, persistence, restart and restoration
        run: python scripts/v11_container_smoke.py --container oracle-v11-ci-smoke
      - name: Container logs
        if: always()
        run: docker logs oracle-v11-ci-smoke || true
  offline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle_v10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle_v10"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: ci
      DRY_RUN: "true"
      REAL_MONEY_ACTIONS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://oracle:oracle@localhost:5432/oracle_v10
      API_FOOTBALL_KEY: fake_ci_api_football_key
      OPENAI_API_KEY: fake_ci_openai_key
      LLM_ENABLED: "false"
      LLM_SHADOW_ONLY: "true"
      LLM_ALLOW_PAID_CALLS: "false"
      OPENAI_DAILY_BUDGET_USD: "0"
      OPENAI_SCAN_BUDGET_USD: "0"
      OPENAI_FIXTURE_BUDGET_USD: "0"
      TELEGRAM_BOT_TOKEN: fake_ci_telegram_token
      TELEGRAM_CHAT_ID: fake_ci_chat_id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Secret scan
        run: python scripts/secret_scan.py --root .
      - name: Compile
        run: python -m compileall -q .
      - name: Alembic upgrade
        run: python app.py db upgrade
      - name: Alembic status
        run: python app.py db status
      - name: V10 tests
        run: |
          python test_v10_foundation.py
          python test_v10_persistence.py
          python test_v10_statistics.py
          python test_v10_llm.py
          python test_v10_operations.py
      - name: Replay smoke
        run: |
          python app.py replay provider --file tests/fixtures/providers/api_football/fixtures_sample.json --provider api_football --dry-run
          python app.py demo postgres-end-to-end --json --database-url "$DATABASE_URL"
      - name: Statistical smoke
        run: |
          python app.py demo statistical-end-to-end --json
      - name: LLM shadow smoke
        run: |
          python app.py llm doctor
          python app.py llm prompts validate
          python app.py llm evaluate --dataset tests/fixtures/llm_eval --mock --ablation
          python app.py llm benchmark-routing --dataset tests/fixtures/llm_eval --mock
          python app.py demo llm-shadow-end-to-end --mock --json
      - name: Operational shadow smoke
        run: |
          python app.py scheduler tick --dry-run
          python app.py fixtures discover --days 3 --dry-run
          python app.py providers health
          python app.py providers quotas
          python app.py demo operational-shadow-end-to-end --mock --json
      - name: Historical tests
        run: |
          set -e
          for f in test_*.py; do
            python "$f"
          done
      - name: Lint if configured
        run: |
          if [ -f pyproject.toml ] && grep -q "ruff" pyproject.toml; then
            python -m ruff check .
          else
            echo "ruff non configure"
          fi
      - name: Type check if configured
        run: |
          if [ -f mypy.ini ] || ([ -f pyproject.toml ] && grep -q "mypy" pyproject.toml); then
            python -m mypy .
          else
            echo "type check non configure"
          fi
      - name: Project audit smoke
        run: python project_audit.py --no-imports --no-git
      - name: Docker build
        run: docker build -t oracle-football-bot-ci .
